<style>
/* Layout: a single reading column (66ch) for argument, charts allowed to widen to 980px; the
   thermal colour scale of the proof heat-maps is the one bold device, everything else stays quiet. */
:root {
  --paper: #f6f7f9;
  --panel: #ffffff;
  --ink: #161a21;
  --ink-2: #4a5160;
  --ink-3: #7a8191;
  --rule: #dfe2e8;
  --grid: #eceef2;
  --c-mathlib: #2a78d6;
  --c-openai: #eb6834;
  --c-human: #1baf7a;
  --c-other: #8a8fa0;
  --heat-0: #f6f7f9;
  --heat-1: #fde6c8;
  --heat-2: #f9b77d;
  --heat-3: #ec7a45;
  --heat-4: #c4452a;
  --heat-ink-hot: #ffffff;
  --code-bg: #fbfbfc;
  --d1: #5b6b86; --d2: #9aa6bb; --d3: #2f3a4d; --d4: #c7cfdc; --d5: #e3e7ee;
  --f-display: "Spectral", "Iowan Old Style", Georgia, serif;
  --f-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --s-1: 12px; --s-2: 14px; --s-3: 16px; --s-4: 20px; --s-5: 28px; --s-6: 40px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #12151a; --panel: #191d24; --ink: #eef0f4; --ink-2: #b7bdc9; --ink-3: #8a91a0;
    --rule: #2b313b; --grid: #232831; --c-mathlib: #3987e5; --c-openai: #d95926; --c-human: #199e70;
    --c-other: #8a8fa0; --heat-0: #191d24; --heat-1: #4a3524; --heat-2: #7a4a26; --heat-3: #b55a2c;
    --heat-4: #e0673a; --heat-ink-hot: #ffffff; --code-bg: #161a20; --d1: #8494b0; --d2: #5d6880; --d3: #c5cede; --d4: #3d4658; --d5: #2a303b; 
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #12151a; --panel: #191d24; --ink: #eef0f4; --ink-2: #b7bdc9; --ink-3: #8a91a0;
  --rule: #2b313b; --grid: #232831; --c-mathlib: #3987e5; --c-openai: #d95926; --c-human: #199e70;
  --c-other: #8a8fa0; --heat-0: #191d24; --heat-1: #4a3524; --heat-2: #7a4a26; --heat-3: #b55a2c;
  --heat-4: #e0673a; --heat-ink-hot: #ffffff; --code-bg: #161a20; --d1: #8494b0; --d2: #5d6880; --d3: #c5cede; --d4: #3d4658; --d5: #2a303b; 
}
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: var(--s-3); line-height: 1.6; }
.wrap { max-width: 980px; margin-inline: auto; padding-inline: 20px; padding-block: 48px 80px; display: grid; gap: var(--s-6); }
.col { max-width: 66ch; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(34px, 6vw, 52px); line-height: 1.05; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-5); line-height: 1.2; margin: 0; text-wrap: balance; }
h3 { font-size: var(--s-2); font-weight: 600; margin: 0; }
p { margin: 0; }
section { display: grid; gap: var(--s-3); }
.eyebrow { font-family: var(--f-mono); font-size: var(--s-1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.lede { font-size: var(--s-4); line-height: 1.5; color: var(--ink); }
.muted { color: var(--ink-2); }
.small { font-size: var(--s-2); }
.cap { font-size: var(--s-1); color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
code, .mono { font-family: var(--f-mono); font-size: 0.9em; }
.formula { font-family: var(--f-display); font-style: italic; font-size: var(--s-4); padding-block: 4px; }
.formula b { font-style: normal; font-weight: 500; }
.figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: var(--s-4); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-block: var(--s-4); }
.fig .v { font-family: var(--f-display); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.fig .v small { font-size: 16px; color: var(--ink-3); font-family: var(--f-body); }
.fig .l { font-size: var(--s-2); color: var(--ink-2); margin-top: 4px; }
.chart { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: var(--s-4); display: grid; gap: var(--s-2); position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart svg text { fill: var(--ink-2); font-family: var(--f-body); font-size: 12px; }
.chart svg .tick { fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.chart svg .gridline { stroke: var(--grid); stroke-width: 1; }
.chart svg .axis { stroke: var(--rule); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: var(--s-4); font-size: var(--s-1); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 9px; font-size: var(--s-1); box-shadow: 0 4px 16px rgb(0 0 0 / 0.12); display: none; max-width: 300px; z-index: 3; color: var(--ink); }
.tip .t { color: var(--ink-3); }
.proofs { display: grid; gap: var(--s-4); }
.proof { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; display: grid; }
.proof header { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 10px 14px; border-bottom: 1px solid var(--rule); font-size: var(--s-2); }
.proof header .who { font-weight: 600; }
.proof header .meta { color: var(--ink-3); font-variant-numeric: tabular-nums; }
.proof pre { margin: 0; padding: 14px; overflow-x: auto; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.75; background: var(--code-bg); border-radius: 0 0 6px 6px; white-space: pre; }
.proof pre span[data-b] { border-radius: 2px; padding: 1px 0; cursor: default; }
.proof pre span[data-b]:hover { outline: 1px solid var(--ink); }
.heatkey { display: flex; align-items: center; gap: 10px; font-size: var(--s-1); color: var(--ink-2); flex-wrap: wrap; }
.heatkey .bar { display: flex; }
.heatkey .bar span { width: 44px; height: 12px; display: inline-block; text-align: center; }
.heatkey .bar + .lbls { display: none; }
.scale { display: grid; grid-template-columns: repeat(5, 44px); font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tablebox { overflow-x: auto; border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: var(--s-2); font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--ink-3); font-weight: 500; font-size: var(--s-1); }
tr:last-child td { border-bottom: 0; }
.method { font-size: var(--s-2); line-height: 1.65; display: grid; gap: var(--s-2); }
.method ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; font-size: var(--s-1); }
.seg button { font: inherit; border: 0; background: transparent; color: var(--ink-2); padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button:focus-visible, .proof pre span:focus-visible { outline: 2px solid var(--c-mathlib); outline-offset: 1px; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; align-items: baseline; }
@media (max-width: 520px) { .wrap { padding-inline: 16px; padding-block: 28px 56px; } .fig .v { font-size: 28px; } }
</style>
